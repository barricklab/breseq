name: build-and-test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false          # let both OS jobs finish independently
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}      # login shell: activates conda env + compiler vars
    steps:
      - uses: actions/checkout@v5

      - name: Set up conda environment
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: dev-environment.yml
          activate-environment: breseq-dev
          auto-activate: false

      # zlib/miniz/htslib come from the conda environment, and configure.ac
      # searches ${prefix} for them -- hence --prefix=$CONDA_PREFIX. Do not drop
      # it back to a bare ./configure: that only ever worked because conda's
      # compiler-activation scripts happened to export -isystem
      # $CONDA_PREFIX/include, which stopped taking effect when conda-forge
      # moved to gcc 15 and broke this job with "miniz/miniz.h not found".
      - name: Build
        run: |
          # Fail here with a clear message if the environment is not activated,
          # rather than deep inside configure's header checks.
          test -n "$CONDA_PREFIX" || { echo "::error::conda env not activated (CONDA_PREFIX unset)"; exit 1; }
          ./bootstrap.sh
          ./configure --prefix="$CONDA_PREFIX"
          make -j$(getconf _NPROCESSORS_ONLN)

      # Offline and instant: parses tests/test_data_manifest.tsv, checks the
      # column format / md5 shape / URL scheme, and verifies that every dataset
      # named by a TEST_DATA= line in a testcmd.sh actually exists in it. This
      # catches a typo'd or missing manifest entry on the pull request that
      # introduces it, rather than after a long download at the start of a run.
      - name: Lint test-data manifest
        run: tests/fetch_test_data.sh --lint

      - name: Run tests
        run: make test          # exits non-zero if any of the 66 tests fail

      # NOTE: 'make test-long' is deliberately NOT run in CI at all. It downloads
      # gigabytes from ENA/NCBI and runs breseq on a full bacterial genome, which
      # would blow this job's 60-minute timeout and make every pull request
      # depend on third-party FTP availability. Run it locally instead.
