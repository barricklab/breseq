name: breseq-dev
channels:
  - conda-forge
  - bioconda
  - defaults
# Barrick lab pre-release channel, published by barricklab/conda. Carries development builds that
# are not on conda-forge/bioconda -- currently CNery, whose builds are tagged with the git commit
# they were made from (build string g<short sha>).
  - https://barricklab.github.io/conda/
dependencies:
# Needed for compiling
#  => Should be compatible with any versions
  - cxx-compiler
  - autoconf
  - automake
  - libtool
  - pkg-config
  - m4
  - cmake
# Dynamically linked libraries.
#   => Need to lock versions for consistency
  - zlib=1.3.2
  - miniz=3.1.1
  - htslib=1.23.1
# Static-only prerequisites for binarydist.sh (CRAM codec support in htslib)
#   => Need to lock versions for consistency
  - bzip2=1.0.8
  - xz=5.8.3
# Command line tools run by breseq
#  => Need to lock versions for consistency
  - samtools=1.23.1
  - bowtie2=2.5.5
  - gnuplot=6.0.4
  - phylip=3.697
# CNery, run by breseq for --predict-copy-number.
#  => Need to lock the version for consistency, and more sharply than the others: CN evidence feeds
#     deletion and amplification prediction, so a change in how CNery places a copy-number boundary
#     moves the coordinates breseq reports. Installing from git HEAD instead is what left the CN test
#     (tests/lambda_mixed_pop_cn_evidence_disabled) unreproducible and disabled.
#
#     The build string is the CNery git commit. ga50689f is the version every CN result in the tree
#     was produced and checked against. Moving to a newer build is a deliberate step, not a refresh:
#     gba1ead5 changes the median-filter window used to smooth coverage at deletion/amplification
#     boundaries, which is exactly what sets the CN coordinates.
#
#     This package pins pandas itself (>=2.2.0,<3), which the previous pip install could not do --
#     pip resolved pandas 3.x, which dropped the private DataFrame._append that CNery's HMM calls.
  - cnery-prerelease=0.0.0=ga50689f
# What CNery computes with.
#  => Need to lock the versions for consistency, because pinning CNery's own build string is not
#     enough. CNery fits the ori-ter and GC corrections with scipy.optimize.minimize, scipy.stats,
#     scipy.ndimage and statsmodels, so the arithmetic -- and with it the trailing digits of the
#     corrected coverage breseq reports -- belongs to these packages, not to CNery. Left unpinned
#     they came in as transitive dependencies and were re-resolved by every 'conda env create'.
#
#     This is not hypothetical: recreating this environment on 2026-08-12 moved one CN entry's
#     relative_coverage from 0.035776 to 0.0357757 with breseq and CNery both unchanged, failing
#     long_ltee_ara_m3_32k_mp2800. breseq now writes that field at three significant figures so
#     noise this small cannot fail a test, but these pins are what keep the CN *coordinates*
#     stable, and those do feed deletion and amplification prediction (see above).
#
#     libopenblas is here for the same reason one step down: a BLAS kernel change reorders the
#     reductions underneath numpy. It is the pin most likely to make a solve fail on another
#     platform; drop it before dropping the others.
  - numpy=2.5.2
  - scipy=1.18.0
  - pandas=2.3.3
  - statsmodels=0.14.6
  - libopenblas=0.3.34
# Used to run the consistency tests in parallel ('make test'), and to run CNery.
#  => See tests/Snakefile. Pinned to the minor version because it anchors the build strings of
#     everything above -- the numeric stack is only as pinned as the interpreter it is built for.
  - python=3.14
  - snakemake-minimal
# Used to build the documentation website (mkdocs) -- 'make docs'/./binarydist.sh
#  => Unpinned: pure build tooling, doesn't affect breseq's own output reproducibility
  - mkdocs
  - mkdocs-material
  - mike
